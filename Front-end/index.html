  <script>
    // Dark by default; apply the saved choice before first paint (no white flash in dark).
    (function () {

  <style>
    /* Splash loader: shown before the app's JS/CSS arrive, removed by
       src/lib/splash.js once the catalogue is ready (or after 3s). */
    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #F4F0E8; transition: opacity .5s ease, visibility .5s ease; }
    #splash.is-done { opacity: 0; visibility: hidden; }
    #splash .mark { font: 400 44px/1 'DM Serif Display', Georgia, serif; letter-spacing: -0.02em; color: #302A25; opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease; }
    #splash.fonts-ready .mark { opacity: 1; transform: none; }
    #splash .mark i { font-style: normal; color: #777F65; }
    #splash .bar { position: relative; width: 120px; height: 2px; overflow: hidden; border-radius: 2px; background: rgba(48,42,37,.12); }
    #splash .bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #777F65; animation: splash-sweep 1.1s ease-in-out infinite; }
    html.dark body { background: #000000; }
    html.dark #splash { background: #000000; }
    html.dark #splash .mark { color: #F5F3EE; }
    html.dark #splash .bar { background: rgba(245,243,238,.14); }
    html.dark #splash .mark i, html.dark #splash .bar::after { color: #D4A574; background-color: #D4A574; }
    html.dark #splash .mark i { background: none; }
    @keyframes splash-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; opacity: .5; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading Laceloft">
    <div class="mark">laceloft<i>.</i></div>
    <div class="bar"></div>
  </div>
  <script>
    // Reveal the wordmark once its serif font is ready, so it never flashes
    // in a fallback font (gives up after 800ms and shows it anyway).
    (function () {
      var el = document.getElementById('splash')
      var show = function () { el.classList.add('fonts-ready') }
      try { Promise.race([document.fonts.load('400 44px "DM Serif Display"'), new Promise(function (r) { setTimeout(r, 800) })]).then(show, show) } catch (e) { show() }
    })()
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
